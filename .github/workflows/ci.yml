name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality-${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest


  release-artifact:
    name: Release artifact / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release

      - name: Build and inspect release distributions
        run: |
          uv python install 3.11
          uv build --out-dir dist
          uvx --from twine==7.0.0 twine check dist/*
          python3 scripts/verify_release_artifacts.py dist

      - name: Install the wheel in a fresh environment
        run: |
          uv venv --clear --seed --python 3.11 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/python -m pip check
          test "$(.release-venv/bin/google-tasks-mcp --version)" = "google-tasks-mcp 0.3.1"
          test "$(.release-venv/bin/google-tasks-mcp-auth --version)" = "google-tasks-mcp-auth 0.3.1"
          .release-venv/bin/google-tasks-mcp --help
          .release-venv/bin/google-tasks-mcp-auth --help

      - name: Verify MCP stdio contract without Google credentials
        run: |
          .release-venv/bin/python scripts/verify_mcp_stdio.py \
            --command .release-venv/bin/google-tasks-mcp \
            --version 0.3.1
